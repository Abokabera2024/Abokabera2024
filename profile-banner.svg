    <circle cx="1112" cy="238" r="19" fill="none" stroke="#7ae7ff" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M1098 239 l9 9 19-22" fill="none" stroke="#7ae7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
